name: simple

# Bind mounts.  Relative sources resolve against this file's directory.
#
#   Only the source and data trees are mounted -- deliberately NOT the project
#   root.  The image builds artifacts under third_party/ (curobo, the SONIC
#   controller) and keeps its venv at /workspace/simple/.venv; mounting the
#   whole repo would shadow all of that with the host checkout.
x-default-isaacsim-volumes: &default-isaacsim-volumes
  # Source code: host edits take effect immediately, no rebuild.
  - type: bind
    source: ./src
    target: /workspace/simple/src
  - type: bind
    source: ./scripts
    target: /workspace/simple/scripts
  - type: bind
    source: ./examples
    target: /workspace/simple/examples
  # Data: downloaded assets and generated datasets persist on the host.
  - type: bind
    source: ${DATA_DIR:-./data}
    target: /workspace/simple/data
  # Run logs and eval outputs (e.g. scripts/launch_psi0_eval_pair.sh writes logs/<stamp>/).
  - type: bind
    source: ./logs
    target: /workspace/simple/logs
  - type: bind
    source: /tmp/.X11-unix
    target: /tmp/.X11-unix
  - type: bind
    source: ${PWD}/.uv-cache
    target: /workspace/.uv-cache
  # Isaac Sim runtime caches, kept on the host so containers (all run with --rm)
  # don't recompile shaders / CUDA kernels on every start.  Shared by concurrent
  # containers; Kit guards its caches with lock files.  Delete
  # ${ISAAC_CACHE_DIR:-./.isaac-cache} to force a cold start.
  #   kit:     shader caches (rtx/gl), DerivedDataCache, generated OmniGraph nodes
  #            (Isaac Sim runs from the pip wheel, so Kit's cache lives in the venv,
  #            under the image's Python version. Both paths are mounted, so pre-upgrade
  #            Isaac Sim 4.5 / Python 3.10 images and 6.2 / Python 3.12 images both work;
  #            each reads only its own, and the two Kit versions don't share a cache)
  #   ov:      texture cache
  #   compute: CUDA JIT cache
  #   warp:    Warp kernel cache
  - type: bind
    source: ${ISAAC_CACHE_DIR:-./.isaac-cache}/kit
    target: /workspace/simple/.venv/lib/python3.10/site-packages/omni/cache
    bind:
      create_host_path: true
  - type: bind
    source: ${ISAAC_CACHE_DIR:-./.isaac-cache}/kit-py312
    target: /workspace/simple/.venv/lib/python3.12/site-packages/omni/cache
    bind:
      create_host_path: true
  - type: bind
    source: ${ISAAC_CACHE_DIR:-./.isaac-cache}/ov
    target: /root/.cache/ov
    bind:
      create_host_path: true
  - type: bind
    source: ${ISAAC_CACHE_DIR:-./.isaac-cache}/computecache
    target: /root/.nv/ComputeCache
    bind:
      create_host_path: true
  - type: bind
    source: ${ISAAC_CACHE_DIR:-./.isaac-cache}/warp
    target: /root/.cache/warp
    bind:
      create_host_path: true

# Runtime config shared by every service.  Only isaac-sim builds the image; the
# run services never pull or build, so a missing simple:${DATE} tag fails fast
# with "No such image" instead of starting a ~1 h build.  Build with
# `docker compose build isaac-sim`.
x-isaac-sim: &isaac-sim
  # user: ${MY_UID}:${MY_GID}
  image: simple:${DATE:-20261027}
  pull_policy: never
  network_mode: "host"
  # privileged: true # conflicts with runtime: nvidia
  runtime: nvidia
  environment:
    - DISPLAY=${DISPLAY:-:0}
    - OMNI_KIT_ACCEPT_EULA=Y
    - MUJOCO_GL=egl
    - NVIDIA_VISIBLE_DEVICES=${GPUs:-0}  # which GPUs to expose
    - NVIDIA_DRIVER_CAPABILITIES=compute,utility,graphics
    # set it in .env
    - HF_TOKEN=${HF_TOKEN:-}
  volumes: *default-isaacsim-volumes
  shm_size: "16gb"
  mem_limit: "0"          # 0 = unlimited
  memswap_limit: "0"

  stdin_open: true # docker run -i
  tty: true  # Keeps the container running interactively

services:
  isaac-sim:
    <<: *isaac-sim
    build:
      context: .
      dockerfile: Dockerfile
      network: host
      args:
        # nvcr.io/nvidia/isaac-sim base tag; must match isaacsim in pyproject.toml.
        # 6.x images are Ubuntu 24.04 and need host driver >= 570.169.
        - ISAAC_SIM_VERSION=${ISAAC_SIM_VERSION:-6.2.0}
        - TORCH_CUDA_ARCH_LIST=${TORCH_CUDA_ARCH_LIST:-8.0+PTX}
        - TIMEZONE=${TIMEZONE:-UTC}
        # 0 = minimal (default), 1 = full (decoupled_wbc[full] — real-robot / GUI teleop)
        - SIMPLE_FULL_INSTALL=${SIMPLE_FULL_INSTALL:-0}
        # 1 = build the SONIC WBC controller into the image (default), 0 = skip
        - SIMPLE_BUILD_SONIC_WBC=${SIMPLE_BUILD_SONIC_WBC:-1}
        # 1 = bake the SONIC ONNX checkpoints in (default), 0 = fetch at runtime
        - SIMPLE_DOWNLOAD_SONIC_CKPT=${SIMPLE_DOWNLOAD_SONIC_CKPT:-1}
    x-bake:
      platforms:
        - linux/amd64
        - linux/arm64

  sim:
    <<: *isaac-sim
    entrypoint: /bin/bash
    command: []

  datagen:
    <<: *isaac-sim
    entrypoint: ["uv", "run", "--no-sync", "datagen"]
    command: []

  replay:
    <<: *isaac-sim
    # --no-sync: a plain `uv run` would exact-sync the venv to the lock and
    # uninstall the pip-installed curobo / sonic packages.
    entrypoint: ["uv", "run", "--no-sync", "replay"]
    command: ["--headless"]

  eval:
    <<: *isaac-sim
    entrypoint: ["uv", "run", "--no-sync", "eval"]
    command: [] 

  eval-decoupled-wbc:
    <<: *isaac-sim
    entrypoint: ["uv", "run", "--no-sync", "eval-decoupled-wbc"]
    command: []

  eval-sonic-wbc:
    <<: *isaac-sim
    entrypoint: ["bash", "scripts/run_eval_wbc.sh"]
    command: []

  gpu-test:
    image: simple:${DATE:-20261027}
    pull_policy: never
    command: /workspace/simple/.venv/bin/python -c "import torch; print(torch.cuda.is_available()); print(torch.cuda.device_count())"
    environment:
      - NVIDIA_VISIBLE_DEVICES=${GPUs:-0}  # which GPUs to expose
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    runtime: nvidia

