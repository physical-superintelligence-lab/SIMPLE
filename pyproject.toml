[project]
name = "simple"
version = "0.1.0"
description = "SIMPLE: SIMulation-based Policy Learning & Evaluation"
readme = "README.md"
license = "MIT"
license-files = ["license.md"]
requires-python = "==3.12.*"
dependencies = [
    "dm-control==1.0.45",
    "isaacsim[all,extscache]==6.2.0",
    "isaaclab==3.0.0",
    "mujoco==3.12.0",
    "mjlab",
    "openpi-client",
    "python-fcl>=0.7.0.8",
    "rich>=13.9.4",
    "torch==2.11.0",
    "torchvision==0.26.0",
    "transforms3d>=0.4.2",
    "trimesh>=4.7.1",
    "typer-slim>=0.17.3",
    "gymnasium>0.29.1",
    "python-dotenv>=0.9.9",
    "numpy>=2"
]

[project.optional-dependencies]
lerobot = [
    "lerobot"
]
active_perception = [
    "openai"
]
full = [
    "warp-lang==1.17.0",
    "openai",
]

[build-system]
requires = ["setuptools>=77", "wheel"]  # >=77 for PEP 639 license metadata
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
simple = ["resources/*"]

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cu128"

[[tool.uv.index]]
url = "https://pypi.nvidia.com/"

[dependency-groups]
dev = [
    "black>=25.1.0",
    "isort>=6.0.1",
    "pre-commit>=4.2.0",
    "pytest>=8.4.1",
    "ruff>=0.12.7",
    "huggingface_hub>=0.18.3",
]
docs = [
    "furo>=2025.7.19",
    "myst-parser>=4.0.1",
    "sphinx>=7.3.7",
    "sphinx-autobuild>=2024.10.3",
    "sphinx-autodoc-typehints>=2.3.0",
    "sphinx-copybutton>=0.5.2",
    "sphinxemoji>=0.2.0",
]

sonic = [
    "gear_sonic[sim,teleop]",
    "unitree-sdk2py",
    "xrobotoolkit-sdk",
    "decoupled-wbc[full]",
]

[tool.uv]
#default-groups = ["sonic"]
index-strategy = "unsafe-best-match"
# isaaclab 3.0.0 hard-pins torch/torchvision and needs numpy>=2; some third-party
# packages (openpi-client, lerobot) carry stale upper bounds on these.
override-dependencies = [
    "torch==2.11.0",
    "torchvision==0.26.0",
    "numpy>=2",
    "urllib3>=2.8.0",
    "scipy==1.17.0",
    "datasets>=3.6.0",
    "tinyobjloader==2.0.0rc13",
    "mujoco==3.12.0",
    "mujoco-warp~=3.12.0",
    "cyclonedds==11.0.1",
    "pin>=3",
]

# xrobotoolkit-sdk has no pyproject.toml, so it builds with legacy setuptools in an
# isolated env that would otherwise only contain setuptools+wheel. Its CMakeLists.txt
# does `find_package(pybind11 REQUIRED)` and setup.py passes no -Dpybind11_DIR, so the
# build env needs pybind11 installed at its *prefix* (share/cmake/pybind11) -- which is
# what pybind11-global does, and where CMake looks by default. The plain `pybind11`
# wheel only ships its config inside site-packages and would NOT be found.
[tool.uv.extra-build-dependencies]
xrobotoolkit-sdk = ["pybind11-global>=2.12"]

[tool.uv.sources]
evdev = { path = "third_party/evdev" }
simple = {path = ".", editable = true }
#nvidia-curobo = {path = "third_party/curobo", editable = true }
openpi-client = {path = "third_party/openpi-client", editable = true }
gear_sonic = {path = "third_party/gear_sonic", editable = true }
unitree-sdk2py = {path = "third_party/unitree_sdk2_python", editable = true }
xrobotoolkit-sdk = {path = "third_party/XRoboToolkit-PC-Service-Pybind_X86_and_ARM64", editable = true }
decoupled-wbc = {path = "third_party/decoupled_wbc", editable = true }
lerobot = {git = "https://github.com/songlin/lerobot.git", rev = "09929d8057b044b53aecaf5c6d7eb71f99e8beb9"}
# Last mjlab commit before main moved to torch>=2.14 (isaaclab 3.0.0 pins torch==2.11.0);
# also the first to pin rsl-rl-lib==5.5.1, matching isaaclab.
mjlab = {git = "https://github.com/mujocolab/mjlab.git", rev = "a1882850794fc17b2e6d847ae50ace84182ebda3"}

[project.scripts]
eval = "simple.cli.eval:typer_main"
datagen = "simple.cli.datagen:typer_main"
replay = "simple.cli.replay:typer_main"
plan = "simple.cli.plan:typer_main"
control = "simple.cli.control:typer_main"
render = "simple.cli.render:typer_main"
teleop-decoupled-wbc = "simple.cli.teleop_decoupled_wbc:typer_main"
teleop-wbc = "simple.cli.teleop_wbc:typer_main"
collect-sonic-motion = "simple.cli.collect_sonic_motion:typer_main"
render-decoupled-wbc = "simple.cli.render_decoupled_wbc:typer_main"
replay-decoupled-wbc = "simple.cli.replay_decoupled_wbc:typer_main"
replay-wbc = "simple.cli.replay_wbc:typer_main"
eval-decoupled-wbc = "simple.cli.eval_decoupled_wbc:typer_main"
eval-wbc = "simple.cli.eval_wbc:typer_main"
